services:
  - type: web
    name: transcontrol-taller
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: transcontrol-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: OSCAR_USERNAME
        value: oscar1
      - key: OSCAR_NAME
        value: Oscar 1
      - key: OSCAR_PASSWORD
        sync: false
      - key: FERNANDA_USERNAME
        value: fernanda
      - key: FERNANDA_NAME
        value: Fernanda
      - key: FERNANDA_PASSWORD
        sync: false
      - key: WORKSHOP_USERNAME
        value: taller1
      - key: WORKSHOP_NAME
        value: Técnico de taller 1
      - key: WORKSHOP_PASSWORD
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:admin@transcontrol.local
