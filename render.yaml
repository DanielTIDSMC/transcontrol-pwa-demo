services:
  - type: web
    name: transatlante-mesa-ayuda
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_NAME
        value: Administrador TICS
      - key: ADMIN_PASSWORD
        sync: false
      - key: TICS_USERNAME
        value: tics
      - key: TICS_NAME
        value: Soporte TICS
      - key: TICS_PASSWORD
        sync: false
      - key: EMPLOYEE_USERNAME
        value: colaborador
      - key: EMPLOYEE_NAME
        value: Colaborador de prueba
      - key: EMPLOYEE_PASSWORD
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:tics@transatlante.mx
