<!doctype html>

  <title>Mesa de ayuda TICS · TransAtlante</title>
  <style>
    :root{font-family:Inter,"Segoe UI",Arial,sans-serif;color:#192b36;background:#f3f6f8;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}.login{min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at 20% 10%,#d6e9ef 0,transparent 42%),#f3f6f8}.login-card{width:min(440px,100%);padding:38px;background:white;border:1px solid #e3eaee;border-radius:18px;box-shadow:0 20px 70px #17394b12}.brand-mark{width:66px;height:66px;object-fit:contain}.eyebrow{font-size:10px;letter-spacing:1.5px;font-weight:800;color:#167694}.login h1{font-size:28px;margin:18px 0 8px}.login p,.intro p,.form-wrap>p{color:#71818a;font-size:14px;line-height:1.6}.login form{margin-top:26px}.login label,form label{display:block;margin:0 0 16px;font-weight:700;font-size:12px;color:#425661}input,select,textarea{display:block;width:100%;margin-top:7px;padding:12px;border:1px solid #dbe4e8;border-radius:9px;background:white;color:#1b303b;outline:none}input:focus,select:focus,textarea:focus{border-color:#2584a0;box-shadow:0 0 0 3px #2584a019}textarea{min-height:125px;resize:vertical}.primary,.secondary{border:0;border-radius:9px;padding:11px 15px;font-size:12px;font-weight:750}.primary{background:#15566e;color:white}.primary:hover{background:#10465b}.secondary{background:#eaf1f4;color:#285064}.login .primary{width:100%;margin-top:4px}.error{color:#a32935;font-size:12px;margin-top:12px}.app[hidden],.login[hidden]{display:none}.topbar{height:74px;display:flex;align-items:center;justify-content:space-between;padding:0 max(22px,calc((100vw - 1160px)/2));background:#fff;border-bottom:1px solid #e4eaed}.brand{display:flex;align-items:center;gap:11px;font-weight:800}.brand img{width:42px;height:42px;object-fit:contain}.brand small,.profile small{display:block;color:#798991;font-size:10px;font-weight:600;margin-top:3px}.top-actions{display:flex;align-items:center;gap:16px}.profile{text-align:right;font-size:12px}.top-actions button{border:0;background:#edf3f5;color:#255266;border-radius:9px;padding:9px 12px;font-weight:700}.frame{max-width:1160px;margin:auto;padding:30px 22px}.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.tabs{display:flex;gap:8px}.tabs button{border:0;background:transparent;color:#75858e;padding:10px 13px;border-radius:8px;font-weight:700}.tabs button.active{background:#deedf1;color:#15566e}.intro{display:flex;justify-content:space-between;align-items:flex-end;gap:22px;margin:12px 0 23px}.intro h1,.form-wrap h1{font-size:28px;letter-spacing:-.7px;margin:8px 0}.intro p{margin:0}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.metrics>div,.panel{background:#fff;border:1px solid #e4eaed;border-radius:12px;padding:17px}.metrics b{display:block;font-size:23px}.metrics span{display:block;margin-top:4px;color:#75858e;font-size:11px}.ticket-list{display:grid;gap:12px}.ticket,.panel,.form-wrap{background:white;border:1px solid #e3e9ec;border-radius:13px}.ticket{padding:19px 20px}.ticket-head{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.ticket-head small,.ticket-foot small{font-size:10px;color:#798991}.ticket h2{font-size:16px;margin:6px 0 0}.ticket>p{font-size:13px;color:#50636d;line-height:1.6;white-space:pre-wrap}.status{white-space:nowrap;border-radius:20px;padding:6px 10px;font-size:10px;font-weight:800;background:#eaf0f3;color:#50636d}.status.pending_review{background:#fff2dc;color:#976117}.status.assigned{background:#e6efff;color:#375f9a}.status.in_progress{background:#e3f4ed;color:#277553}.status.ready_review{background:#e4f2f5;color:#176a7b}.status.closed{background:#ebedef;color:#67747a}.meta{display:flex;flex-wrap:wrap;gap:10px 22px;color:#7a8990;font-size:11px}.meta b{color:#425661}.ticket-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:15px}.ticket-foot select{display:inline-block;width:auto;min-width:160px;margin:0}.ticket-foot button{margin-left:6px}.ticket details{margin-top:13px;color:#657680;font-size:11px}.ticket details p{margin:7px 0}.photos{display:flex;gap:8px;margin-top:12px}.photos img{width:68px;height:58px;object-fit:cover;border-radius:7px}.empty{padding:55px 20px;text-align:center;border:1px dashed #ccd8de;border-radius:12px;color:#7c8b92;background:#fff}.form-wrap{max-width:700px;margin:12px auto;padding:26px}.form-wrap form{margin-top:24px}.form-wrap small{display:block;color:#819097;font-weight:400;margin-top:5px}.actions{display:flex;gap:9px}.user-layout{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}.panel h2{font-size:15px;margin:0 0 17px}.panel table{width:100%;border-collapse:collapse;font-size:12px}.panel th,.panel td{text-align:left;padding:10px 7px;border-bottom:1px solid #edf0f1}.panel th{font-size:10px;color:#829097;text-transform:uppercase}.panel td small{display:block;color:#829097;margin-top:3px}.notification-wrap{position:relative}.notification-panel{display:none;position:absolute;right:0;top:44px;width:min(340px,90vw);max-height:420px;overflow:auto;background:white;border:1px solid #e3e9ec;border-radius:12px;box-shadow:0 14px 40px #102b391f;z-index:4}.notification-panel.open{display:block}.notification-head,.notice{padding:12px;border-bottom:1px solid #edf0f1;font-size:12px}.notification-head{display:flex;justify-content:space-between;font-weight:800}.notification-head button{padding:5px!important;font-size:10px}.notice small{display:block;color:#798991;margin-top:4px}.notice.read{opacity:.55}.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);padding:12px 16px;background:#173d4f;color:white;border-radius:9px;font-size:12px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}

  </style>
</head>
<body>
  <section class="login" id="login" hidden><div class="login-card"><img class="brand-mark" src="./brand-mark.png" alt="TransAtlante"><div class="eyebrow">TRANSATLANTE · TICS</div><h1>Mesa de ayuda</h1><p>Un solo lugar para reportar problemas de tecnología y dar seguimiento a su solución.</p><form id="loginForm"><label>Usuario<input name="username" autocomplete="username" required autofocus></label><label>Contraseña<input name="password" type="password" autocomplete="current-password" required></label><button class="primary">Iniciar sesión</button><div class="error" id="loginError" role="alert"></div></form></div></section>
  <div class="app" id="app" hidden>
    <header class="topbar"><div class="brand"><img src="./brand-mark.png" alt=""><div>Mesa de ayuda<small>TRANSATLANTE · TICS</small></div></div><div class="top-actions"><div id="profile" class="profile"></div><div class="notification-wrap"><button id="bellBtn" type="button" aria-label="Notificaciones">Avisos</button><div class="notification-panel" id="notificationPanel"></div></div><button id="logout" type="button">Salir</button></div></header>
    <main class="frame"><div class="toolbar"><nav class="tabs"><button id="ticketNav" class="active" type="button">Tickets</button><button id="userNav" type="button" hidden>Usuarios</button></nav><span id="pageTitle">Mesa de ayuda</span></div><div id="content"></div></main>
  </div>
  <script src="./roles-app.js" defer></script>
  <script>if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));</script>
